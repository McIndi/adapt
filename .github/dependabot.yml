# Weekly updates for uv.lock, GitHub Actions, and the Dockerfile base
# images (Python and uv). Pull requests target dev and go through CI and review like any
# other change. Group routine updates so each ecosystem usually opens one
# pull request.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Update uv.lock only. pyproject.toml holds compatible ranges for users;
    # lower bounds move only by a deliberate change noted in CHANGES.md.
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # Capped for a known fastparquet incompatibility; see pyproject.toml,
      # https://github.com/dask/fastparquet/issues/983 and
      # https://github.com/McIndi/adapt/issues/8
      - dependency-name: numpy
        versions: [">=2.5"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
