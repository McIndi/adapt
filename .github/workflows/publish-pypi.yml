name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG_NAME#v}"
          actual=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Release tag '$TAG_NAME' (version $expected) does not match pyproject.toml version $actual." >&2
            echo "Bump pyproject.toml (and adapt/__init__.py, and charts/adapt/Chart.yaml appVersion) before releasing." >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install build tooling
        run: uv sync --locked --extra dev --no-install-project

      - name: Build distributions
        run: uv run --no-sync python -m build

      - name: Record distribution paths
        id: dist
        run: |
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=$sdist" >> "$GITHUB_OUTPUT"

      - name: CycloneDX SBOM for the wheel
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.dist.outputs.wheel }}
          format: cyclonedx-json
          output-file: dist/wheel.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.54.1

      - name: CycloneDX SBOM for the sdist
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.dist.outputs.sdist }}
          format: cyclonedx-json
          output-file: dist/sdist.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.54.1

      - name: Require non-empty CycloneDX documents
        run: python tools/check_cyclonedx.py dist/wheel.cdx.json dist/sdist.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifacts
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/adapt-server
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  evidence:
    needs: [build, publish]
    runs-on: ubuntu-26.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-artifacts
          path: dist

      - name: Upload SBOMs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          cp dist/wheel.cdx.json "adapt_server-${version}.whl.cdx.json"
          cp dist/sdist.cdx.json "adapt_server-${version}.tar.gz.cdx.json"
          gh release upload "$TAG_NAME" \
            "adapt_server-${version}.whl.cdx.json" \
            "adapt_server-${version}.tar.gz.cdx.json" \
            --clobber

      - name: Attest the wheel SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: dist/wheel.cdx.json

      - name: Attest the sdist SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/sdist.cdx.json
