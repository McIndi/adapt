name: Helm CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - charts/adapt/**
      - Dockerfile
      - .ct.yaml
      - .github/workflows/helm-ci.yml
      - tools/test-helm-schema.sh
  pull_request:
    paths:
      - charts/adapt/**
      - Dockerfile
      - .ct.yaml
      - .github/workflows/helm-ci.yml
      - tools/test-helm-schema.sh
  workflow_dispatch:

jobs:
  lint-and-unittest:
    name: Helm lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Latest Helm 3. chart-testing does not support Helm 4
          # (helm/chart-testing#854). Held back: McIndi/adapt#9.
          version: v3.22.0

      # Held at v0.6.3: v1.x rewords schema errors and needs a test change
      # plus a chart version bump. McIndi/adapt#9.
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.3

      - name: Helm lint
        run: helm lint charts/adapt

      - name: Values schema checks
        run: bash tools/test-helm-schema.sh

      - name: Helm unittest
        run: helm unittest charts/adapt

  kind-install-smoke:
    name: kind + ct install + helm test
    runs-on: ubuntu-26.04
    needs: lint-and-unittest
    strategy:
      fail-fast: false
      matrix:
        kindNode:
          # Images published for kind v0.33.0, pinned by digest.
          - kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Latest Helm 3. chart-testing does not support Helm 4
          # (helm/chart-testing#854). Held back: McIndi/adapt#9.
          version: v3.22.0

      - name: Setup chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          # Held at 3.14.0: ct 3.15.0 ships only Sigstore bundles, and action
          # v2.8.0 verifies with the .pem/.sig files that 3.14.0 still ships.
          # Move to 3.15.0 with the action release from
          # helm/chart-testing-action#230. Held back: McIndi/adapt#9.
          version: 3.14.0
          yamllint_version: 1.38.0
          yamale_version: 6.1.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: chart-testing
          node_image: ${{ matrix.kindNode }}

      - name: Build app image
        run: docker build -t adapt-ci:${{ github.sha }} .

      - name: Confirm base image Python 3.14
        run: |
          set -eu
          python_ver=$(docker run --rm --entrypoint python adapt-ci:${{ github.sha }} -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          echo "Image Python version: ${python_ver}"
          test "${python_ver}" = "3.14"

      - name: Load image into kind
        run: kind load docker-image adapt-ci:${{ github.sha }} --name chart-testing

      - name: Run ct install
        run: >-
          ct install
          --config .ct.yaml
          --charts charts/adapt
          --helm-extra-set-args "--set image.repository=adapt-ci --set image.tag=${{ github.sha }} --set image.pullPolicy=IfNotPresent"

      - name: Run ct install (persistence enabled)
        run: >-
          ct install
          --config .ct.yaml
          --charts charts/adapt
          --helm-extra-set-args "--set image.repository=adapt-ci --set image.tag=${{ github.sha }} --set image.pullPolicy=IfNotPresent --set persistence.enabled=true --set persistence.storageClass=standard"

      - name: Install with Helm release name adapt
        run: |
          set -eu
          kubectl create namespace adapt-name-smoke
          helm install adapt charts/adapt \
            --namespace adapt-name-smoke \
            --set image.repository=adapt-ci \
            --set image.tag="${{ github.sha }}" \
            --set image.pullPolicy=IfNotPresent \
            --wait --timeout 5m
          kubectl -n adapt-name-smoke wait --for=condition=available deploy/adapt --timeout=180s
          helm test adapt --namespace adapt-name-smoke

  version-increment:
    name: Chart version increment check
    runs-on: ubuntu-26.04
    needs: lint-and-unittest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          # Held at 3.14.0: ct 3.15.0 ships only Sigstore bundles, and action
          # v2.8.0 verifies with the .pem/.sig files that 3.14.0 still ships.
          # Move to 3.15.0 with the action release from
          # helm/chart-testing-action#230. Held back: McIndi/adapt#9.
          version: 3.14.0
          yamllint_version: 1.38.0
          yamale_version: 6.1.0

      - name: Check chart version increment
        run: >-
          ct lint
          --config .ct.yaml
          --charts charts/adapt
          --check-version-increment
          --target-branch ${{ github.base_ref }}
