name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# docs, test and dependency-audit install the exact, hashed pins from uv.lock
# on the newest Python. `uv sync --locked` fails when uv.lock is out of date
# with pyproject.toml. test-min installs the pyproject.toml lower bounds from
# constraints-min.txt on the oldest supported Python.
jobs:
  docs:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -q

  test-min:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          # Oldest Python allowed by requires-python.
          python-version: "3.11.17"

      - name: Install minimum dependencies
        run: |
          uv venv
          uv pip install -c constraints-min.txt -e ".[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

  dependency-audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install pip-audit
        run: uv sync --locked --only-group audit

      - name: Run pip-audit on every locked package
        run: |
          uv export --locked --format requirements-txt --all-extras --all-groups \
            --no-emit-project --output-file audit-requirements.txt
          uv run --no-sync python -m pip_audit --disable-pip --require-hashes \
            -r audit-requirements.txt
