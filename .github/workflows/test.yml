name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# docs, test, lint, coverage, package-sbom, and dependency-audit install the
# exact, hashed pins from uv.lock on the newest Python. `uv sync --locked`
# fails when uv.lock is out of date with pyproject.toml. test-min installs the
# pyproject.toml lower bounds from constraints-min.txt on the oldest supported
# Python.
jobs:
  docs:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -q

  test-min:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          # Oldest Python allowed by requires-python.
          python-version: "3.11.17"

      - name: Install minimum dependencies
        run: |
          uv venv
          uv pip install -c constraints-min.txt -e ".[dev]"

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run --no-sync ruff check adapt tests

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run --no-sync python -m pytest tests/ --cov=adapt --cov-report=term-missing | tee coverage-summary.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Coverage"
            echo
            echo '```'
            tail -n 40 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  package-sbom:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0

      - name: Build distributions and package the chart
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python -m build
          mkdir -p .chart-package
          helm package charts/adapt --destination .chart-package

      - name: Record artifact paths
        id: artifacts
        run: |
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          chart=$(ls .chart-package/*.tgz)
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "sdist=$sdist" >> "$GITHUB_OUTPUT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"
          mkdir -p sbom

      - name: CycloneDX SBOM for the wheel
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.artifacts.outputs.wheel }}
          format: cyclonedx-json
          output-file: sbom/wheel.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.54.1

      - name: CycloneDX SBOM for the sdist
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.artifacts.outputs.sdist }}
          format: cyclonedx-json
          output-file: sbom/sdist.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.54.1

      - name: CycloneDX SBOM for the chart
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.artifacts.outputs.chart }}
          format: cyclonedx-json
          output-file: sbom/chart.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
          syft-version: v1.54.1

      - name: Require non-empty CycloneDX documents
        run: uv run --no-sync python tools/check_cyclonedx.py sbom/wheel.cdx.json sbom/sdist.cdx.json sbom/chart.cdx.json

  dependency-audit:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"

      - name: Install pip-audit
        run: uv sync --locked --only-group audit

      - name: Run pip-audit on every locked package
        run: |
          uv export --locked --format requirements-txt --all-extras --all-groups \
            --no-emit-project --output-file audit-requirements.txt
          uv run --no-sync python -m pip_audit --disable-pip --require-hashes \
            -r audit-requirements.txt
