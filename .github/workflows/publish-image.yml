name: Publish Container Image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Reuses the same Test workflow that gates every push/PR, so a release
  # can't publish an image that skipped CI — this isn't just "main was
  # green when the release was cut," it's a hard dependency for this run.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG_NAME#v}"
          actual=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Release tag '$TAG_NAME' (version $expected) does not match pyproject.toml version $actual." >&2
            echo "Bump pyproject.toml (and adapt/__init__.py, and charts/adapt/Chart.yaml appVersion) before releasing." >&2
            exit 1
          fi

      - name: Derive image tags
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG_NAME#v}"
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/mcindi/adapt-server:$version"
            if [ "$PRERELEASE" = "false" ]; then
              echo "ghcr.io/mcindi/adapt-server:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
