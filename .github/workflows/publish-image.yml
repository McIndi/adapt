name: Publish Container Image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Reuses the same Test workflow that gates every push/PR, so a release
  # can't publish an image that skipped CI — this isn't just "main was
  # green when the release was cut," it's a hard dependency for this run.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    name: Build and push image to GHCR
    needs: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG_NAME#v}"
          actual=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$expected" != "$actual" ]; then
            echo "Release tag '$TAG_NAME' (version $expected) does not match pyproject.toml version $actual." >&2
            echo "Bump pyproject.toml (and adapt/__init__.py, and charts/adapt/Chart.yaml appVersion) before releasing." >&2
            exit 1
          fi

      - name: Derive image tags
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG_NAME#v}"
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/mcindi/adapt-server:$version"
            if [ "$PRERELEASE" = "false" ]; then
              echo "ghcr.io/mcindi/adapt-server:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
