[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-server"
version = "0.3.0"
description = "Adaptive file-backed FastAPI server that turns datasets into CRUD APIs and UIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "notesofcliff", email = "notesofcliff@gmail.com" }]
keywords = ["fastapi", "api", "csv", "excel", "parquet", "markdown", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "sqlmodel>=0.0.14,<0.1",
    "pendulum>=3.0,<4",
    "watchfiles>=0.20,<2",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.2,<3",
    "markdown>=3.5,<4",
    "python-multipart>=0.0.9,<0.1",
    "mutagen>=1.47,<2",
    "imageio>=2.31,<3",
    "imageio-ffmpeg>=0.4,<1",
    "pillow>=12.3,<13",
    "python-json-logger>=2.0,<5",
    # fastparquet 2026.5.0 uses generic datetime/timedelta units that NumPy
    # 2.5 deprecates. Remove this cap when fastparquet adopts explicit units.
    "numpy>=1.26,<2.5",
    "pandas>=2.0,<4",
    "fastparquet>=2024.0.0,<2027",
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "httpx2>=2.0,<3",
    "build>=1.0,<2",
    "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://www.mcindi.com/software/adapt/"
Repository = "https://github.com/McIndi/adapt"
Issues = "https://github.com/McIndi/adapt/issues"

[project.scripts]
adapt = "adapt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapt*"]

[tool.setuptools.package-data]
adapt = [
    "templates/**/*.html",
    "static/**/*",
]
