[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-server"
version = "0.5.2"
description = "Adaptive file-backed FastAPI server that turns datasets into CRUD APIs and UIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "notesofcliff", email = "notesofcliff@gmail.com" }]
keywords = ["fastapi", "api", "csv", "excel", "parquet", "markdown", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# Compatible ranges for users. Lower bounds are the oldest versions that
# resolve together and pass the suite on the oldest supported Python (see
# constraints-min.txt and the test-min CI job). Upper bounds only for a known
# incompatibility, with an issue reference. Exact tested pins live in
# uv.lock.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.31.1",
    "sqlmodel>=0.0.14",
    "pendulum>=3.0",
    "watchfiles>=0.20",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
    "markdown>=3.5",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
    "pillow>=12.3",
    "python-json-logger>=2.0",
    # fastparquet (2026.5.0 through 2026.9.0) uses generic timedelta units
    # that NumPy 2.5 deprecates; reading a timedelta column warns and will
    # fail when NumPy turns the deprecation into an error. Remove this cap
    # when fastparquet adopts explicit units:
    # https://github.com/dask/fastparquet/issues/983
    # Tracked in https://github.com/McIndi/adapt/issues/8
    "numpy>=1.26,<2.5",
    "pandas>=2.0",
    "fastparquet>=2024.2.0",
    "mcp>=2.2",
    "PyJWT>=2.10.1",
    "cryptography>=43",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.5.0",
    "build>=1.0",
    "twine>=5.0",
]

# Tooling for CI and the docs build. Not published; pinned in uv.lock.
[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.6",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-mermaid2-plugin>=1.2.3",
]
audit = [
    "pip-audit>=2.10.1",
]

[project.urls]
Homepage = "https://www.mcindi.com/software/adapt/"
Repository = "https://github.com/McIndi/adapt"
Issues = "https://github.com/McIndi/adapt/issues"

[project.scripts]
adapt = "adapt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapt*"]

[tool.setuptools.package-data]
adapt = [
    "templates/**/*.html",
    "static/**/*",
]
