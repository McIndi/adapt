apiVersion: v1
kind: Service
metadata:
  name: {{ include "adapt.fullname" . }}
  labels:
    {{- include "adapt.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and .Values.service.nodePort (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector:
    {{- include "adapt.selectorLabels" . | nindent 4 }}
