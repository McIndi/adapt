apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "adapt.fullname" . }}-health-test"
  labels:
    {{- include "adapt.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.9.1
    command:
    - /bin/sh
    - -ec
    - |
      curl -fsS "http://{{ include "adapt.fullname" . }}:{{ .Values.service.port }}/health" | grep -q '"status":"ok"'
  restartPolicy: Never
