{{- if and .Values.bootstrapAdmin.enabled (not .Values.bootstrapAdmin.existingSecret) }}
{{- $secretName := printf "%s-bootstrap-admin" (include "adapt.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "adapt.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.bootstrapAdmin.username | b64enc }}
  # Generated once and reused on every subsequent helm upgrade (via `lookup`),
  # so it always matches the password the bootstrap Job already used to
  # create this user. Regenerating it here would desync the Secret from the
  # already-created account.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
