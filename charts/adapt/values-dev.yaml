# Local development overlay with persistent storage, an automatic superuser,
# and a stable NodePort.
#
# Usage:
#   LOCAL_IMAGE=your-local-image
#   LOCAL_TAG=your-tag
#   helm upgrade --install myadapt charts/adapt \
#     -f charts/adapt/values-dev.yaml \
#     --set image.repository="$LOCAL_IMAGE" --set image.tag="$LOCAL_TAG" --set image.pullPolicy=IfNotPresent
#
# Open http://NODE_IP:30080. A port-forward is not required.
#
# Retrieve the generated admin password afterward with:
#   kubectl get secret myadapt-bootstrap-admin -o jsonpath='{.data.password}' | base64 -d && echo

persistence:
  enabled: true
  # k3s uses local-path. For kind or minikube, use standard. For Docker
  # Desktop, use hostpath. Override this value for other clusters.
  storageClass: local-path
  size: 5Gi

bootstrapAdmin:
  enabled: true
  username: admin

service:
  type: NodePort
  nodePort: 30080

# ADAPT_* env vars are applied after conf.json is read, so this always wins
# over whatever's on the PVC's .adapt/conf.json — no need to edit that file
# by hand. Adjust the size limit / extension list to taste.
env:
  - name: ADAPT_UPLOAD_ENABLED
    value: "true"
  - name: ADAPT_UPLOAD_MAX_SIZE_BYTES
    value: "10485760"
