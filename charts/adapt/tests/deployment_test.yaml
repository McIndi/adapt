suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders expected container command and health probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: adapt
      - equal:
          path: spec.template.spec.containers[0].command[1]
          value: serve
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
  - it: labels server pods without changing the immutable deployment selector
    asserts:
      - isNull:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
  - it: does not allow podLabels to override labels required by selectors
    set:
      podLabels:
        app.kubernetes.io/name: wrong-name
        app.kubernetes.io/component: bootstrap
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: adapt
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
  - it: runs with the image UID and writable volume group
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1000
  - it: wires optional config and secret env refs when configured
    set:
      env:
        - name: ADAPT_DEBUG
          value: "true"
      secretEnv:
        - name: ADAPT_ADMIN_PASSWORD
          value: "example-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-adapt-env
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-adapt-env
  - it: uses emptyDir when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
  - it: references dynamic PVC when persistence enabled without existingClaim
    set:
      persistence.enabled: true
      persistence.existingClaim: ""
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-adapt
      - isNull:
          path: spec.template.spec.volumes[0].emptyDir
  - it: references existing PVC when existingClaim is set
    set:
      persistence.enabled: true
      persistence.existingClaim: my-existing-pvc
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-existing-pvc
      - isNull:
          path: spec.template.spec.volumes[0].emptyDir
