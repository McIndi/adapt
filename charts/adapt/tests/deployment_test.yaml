suite: deployment
templates:
  - templates/deployment.yaml
tests:
  - it: renders expected container command and health probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: adapt
      - equal:
          path: spec.template.spec.containers[0].command[1]
          value: serve
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30
  - it: labels server pods without changing the immutable deployment selector
    asserts:
      - isNull:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
  - it: does not allow podLabels to override labels required by selectors
    set:
      podLabels:
        app.kubernetes.io/name: wrong-name
        app.kubernetes.io/component: bootstrap
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: adapt
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
  - it: runs with the image UID and writable volume group
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1000
  - it: wires optional config and secret env refs when configured
    set:
      env:
        - name: ADAPT_DEBUG
          value: "true"
      secretEnv:
        - name: ADAPT_ADMIN_PASSWORD
          value: "example-secret"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-adapt-env
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: RELEASE-NAME-adapt-env
  - it: uses emptyDir when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].emptyDir
          value: {}
      - isNull:
          path: spec.template.spec.volumes[0].persistentVolumeClaim
  - it: references dynamic PVC when persistence enabled without existingClaim
    set:
      persistence.enabled: true
      persistence.existingClaim: ""
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: RELEASE-NAME-adapt
      - isNull:
          path: spec.template.spec.volumes[0].emptyDir
  - it: references existing PVC when existingClaim is set
    set:
      persistence.enabled: true
      persistence.existingClaim: my-existing-pvc
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-existing-pvc
      - isNull:
          path: spec.template.spec.volumes[0].emptyDir
  - it: mounts extra volumes for document seeding or shared storage
    set:
      externalDocumentRoot: true
      extraVolumes:
        - name: documents
          configMap:
            name: seed-documents
      extraVolumeMounts:
        - name: documents
          mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: documents
            configMap:
              name: seed-documents
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: documents
            mountPath: /data
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: adapt-data
  - it: rejects admin bootstrap with an external document root
    set:
      externalDocumentRoot: true
      bootstrapAdmin.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "bootstrapAdmin.enabled cannot be used with externalDocumentRoot"
  - it: rejects an external document root with no extra volume configured
    set:
      externalDocumentRoot: true
    asserts:
      - failedTemplate:
          errorPattern: "externalDocumentRoot=true requires non-empty extraVolumes"
  - it: rejects an external document root combined with persistence
    set:
      externalDocumentRoot: true
      persistence.enabled: true
      extraVolumes:
        - name: documents
          configMap:
            name: seed-documents
      extraVolumeMounts:
        - name: documents
          mountPath: /data
    asserts:
      - failedTemplate:
          errorPattern: "externalDocumentRoot=true is incompatible with persistence.enabled=true"
  - it: omits OIDC env when issuer and clientId are empty
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env
  - it: maps oidc values to ADAPT_OIDC environment variables
    set:
      oidc:
        issuer: https://keycloak.example.com/realms/prod
        clientId: adapt-web
        publicUrl: https://adapt.example.com
        audience: https://adapt.example.com
        localLogin: false
        existingSecret: adapt-oidc
        existingSecretClientSecretKey: client-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADAPT_OIDC_ISSUER
            value: https://keycloak.example.com/realms/prod
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADAPT_OIDC_CLIENT_ID
            value: adapt-web
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADAPT_OIDC_PUBLIC_URL
            value: https://adapt.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADAPT_OIDC_LOCAL_LOGIN
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADAPT_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: adapt-oidc
                key: client-secret
  - it: disables Kubernetes service-link environment variables
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false
  - it: uses Chart appVersion when tag and digest are empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mcindi/adapt-server:0.5.2
  - it: renders an explicit image tag
    set:
      image.tag: "local-build"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mcindi/adapt-server:local-build
  - it: renders repository@digest when digest is set
    set:
      image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mcindi/adapt-server@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - it: rejects tag and digest together
    set:
      image.tag: "0.5.2"
      image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - failedTemplate:
          errorPattern: "image.digest or image.tag"

