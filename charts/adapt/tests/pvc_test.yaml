suite: pvc
templates:
  - templates/pvc.yaml
tests:
  - it: renders no PVC when persistence is disabled
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders PVC when persistence enabled and no existingClaim
    set:
      persistence.enabled: true
      persistence.existingClaim: ""
      persistence.size: 10Gi
      persistence.accessModes:
        - ReadWriteOnce
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-adapt
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce
  - it: renders no PVC when existingClaim is set
    set:
      persistence.enabled: true
      persistence.existingClaim: my-existing-pvc
    asserts:
      - hasDocuments:
          count: 0
  - it: sets storageClassName when storageClass is provided
    set:
      persistence.enabled: true
      persistence.existingClaim: ""
      persistence.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd
  - it: omits storageClassName when storageClass is empty
    set:
      persistence.enabled: true
      persistence.existingClaim: ""
      persistence.storageClass: ""
    asserts:
      - isNull:
          path: spec.storageClassName
