replicaCount: 1

image:
  repository: ghcr.io/mcindi/adapt-server
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Keep fsGroup aligned with securityContext.runAsGroup and the UID/GID pinned
# in the image's Dockerfile. Some storage drivers ignore fsGroup; for those,
# use persistence.annotations supported by the driver or a pre-chowned claim.
podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  # Only used when type is NodePort or LoadBalancer. Leave blank to let
  # Kubernetes auto-assign a port from its NodePort range (30000-32767).
  nodePort: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
  - host: adapt.local
    paths:
    - path: /
      pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  # Allows up to five minutes for startup work such as search indexing before
  # liveness checks can restart the container.
  startup:
    path: /health
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

adapt:
  rootPath: /data
  extraArgs: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: ""
  annotations: {}

# Bootstraps a superuser via a post-install/post-upgrade Helm hook Job that
# runs `adapt addsuperuser`. Requires persistence.enabled=true: the hook Job
# runs in its own pod, so it only shares data with the main deployment when
# they're both backed by the same PVC. Safe to leave enabled across upgrades
# — addsuperuser is a no-op if the username already exists.
bootstrapAdmin:
  enabled: false
  username: admin
  # Name of a pre-existing Secret with `username`/`password` keys (or the
  # keys named below). Takes precedence over the generated Secret. Its
  # password must not be classified as weak by
  # adapt/commands/passwords.py:is_weak_password.
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password

env: []

# Example upload settings:
# env:
#   - name: ADAPT_UPLOAD_ENABLED
#     value: "true"
#   - name: ADAPT_UPLOAD_MAX_SIZE_BYTES
#     value: "10485760"
#   - name: ADAPT_UPLOAD_ALLOWED_EXTENSIONS
#     value: ".csv,.md,.txt"
#   - name: ADAPT_UPLOAD_STRICT_MIME_SNIFFING
#     value: "true"

secretEnv: []

# Mount external document sources such as ConfigMaps, NFS shares, or
# pre-populated volumes into the pod. Mount ConfigMaps below the writable
# document root; use externalDocumentRoot only for a writable source.
extraVolumes: []
extraVolumeMounts: []
# Set to true when an extra writable volume mount supplies the document root.
# The built-in adapt-data volume is omitted in that mode.
externalDocumentRoot: false
